# ينشر قواعد Firebase (firestore.rules) تلقائياً كلما تغيّرت
name: نشر قواعد Firebase
on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json, .github/workflows/firestore-rules.yml]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::لم يُضف السر FIREBASE_SERVICE_ACCOUNT بعد"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@latest deploy --only firestore:rules --project qadisiyah-forms-2026 --non-interactive
