# ينشر قواعد Firebase (firestore.rules) تلقائياً كلما تغيّرت
name: نشر قواعد Firebase
on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json, .github/workflows/firestore-rules.yml]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::لم يُضف السر FIREBASE_SERVICE_ACCOUNT بعد"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm i --no-audit --no-fund firebase-admin@12 >/dev/null
          node -e '
            const admin=require(process.env.RUNNER_TEMP+"/node_modules/firebase-admin");
            const fs=require("fs");
            const sa=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/sa.json","utf8"));
            admin.initializeApp({credential:admin.credential.cert(sa),projectId:"qadisiyah-forms-2026"});
            const src=fs.readFileSync(process.env.GITHUB_WORKSPACE+"/firestore.rules","utf8");
            admin.securityRules().releaseFirestoreRulesetFromSource(src)
              .then(r=>console.log("تم نشر القواعد:",r.name,r.createTime))
              .catch(e=>{ console.error("فشل النشر:",e.message); process.exit(1); });
          '
