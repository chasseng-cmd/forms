<style>
:root{--blue:#0b5f8a;--ink:#000;--mute:#2b2b2b;--line:#d9e0e5;--bg:#f4f6f8;--ok:#1f7a4a;--okbg:#e5f4ec;--wait:#9a5b00;--waitbg:#fdf1dc;--red:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:17px;font-weight:600}
button,input,textarea,select{font:inherit;color:inherit}
header{background:var(--blue);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px}
header h1{font-size:17px;margin:0;flex:1}
header .hb{background:none;border:0;color:#fff;font-size:14px;padding:4px 6px;cursor:pointer}
header .pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);border-radius:18px;padding:7px 12px;font-size:15px;font-weight:600;white-space:nowrap}
header .back{font-size:22px}
main{max-width:720px;margin:0 auto;padding:14px 14px 110px}
.note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--mute);font-size:14px;margin-bottom:12px;line-height:1.7}
.note.warn{background:var(--waitbg);border-color:#efd59c;color:var(--wait)}
.filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card h3{font-size:15px;margin:0 0 6px}
.item{cursor:pointer}.item .t{font-weight:600;line-height:1.5}
.item .m{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.badge{font-size:12px;padding:2px 9px;border-radius:10px;font-weight:600}
.b-draft{background:#eef1f3;color:#4a5560}.b-review{background:var(--waitbg);color:var(--wait)}.b-approved{background:var(--okbg);color:var(--ok)}
.fab{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;border:0;border-radius:28px;padding:14px 26px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer;z-index:4}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input.i,textarea.i,select.i{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}
textarea.i{resize:vertical;min-height:64px;line-height:1.6}
input.i:focus,textarea.i:focus,select.i:focus{outline:2px solid var(--blue);border-color:transparent}
.row{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
.row .hd{display:flex;align-items:center;justify-content:space-between;font-weight:700;color:var(--blue);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.x{background:none;border:0;color:var(--red);font-size:14px;cursor:pointer}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:8px}
.chg{font-size:12px;color:var(--wait);margin-top:3px;line-height:1.5}
.chg::before{content:"كان: "}
.changed{background:#fffaf0!important;border-color:#e9c98a!important}
.newrow{border-color:#e9c98a;background:#fffdf7}
details.st{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
details.st summary{font-size:13px;color:var(--blue);cursor:pointer}
.kind{font-size:12px;color:var(--mute)}
.sum{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;width:100%;margin-top:8px}
.btn.sec{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}

function makeForms(D, LOGO_B64){
const {Document,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType,BorderStyle,VerticalAlign,TableLayoutType,HeightRule,ShadingType,UnderlineType,ImageRun,PageBreak}=D;

const F="Times New Roman", AL=AlignmentType, VA=VerticalAlign;
const run=(t,z,o={})=>new TextRun({text:t,font:{ascii:F,hAnsi:F,cs:F},size:z,sizeComplexScript:z,bold:true,boldComplexScript:true,rightToLeft:!o.ltr,underline:o.u?{type:UnderlineType.SINGLE}:undefined});
// Latin tokens (Q=200m3/hr, 300-Kva) isolated as LTR so they don't flip in iPhone Pages
const runs=(t,z,o={})=>{const out=[];const re=/[0-9A-Za-z][0-9A-Za-z=\/\\.\-]*[A-Za-z][0-9A-Za-z=\/\\.\-]*|[A-Za-z]/g;let i=0,m;t=String(t??"");
  while((m=re.exec(t))){if(m.index>i)out.push(run(t.slice(i,m.index),z,o));out.push(run("⁦"+m[0]+"⁩",z,{...o,ltr:true}));i=m.index+m[0].length;}
  if(i<t.length)out.push(run(t.slice(i),z,o));if(!out.length)out.push(run("",z,o));return out;};
const P=(t,o={})=>new Paragraph({bidirectional:!o.ltr,alignment:o.align||AL.BOTH,spacing:{before:o.before||0,after:o.after??0,line:o.line||276},
  children:Array.isArray(t)?t:(o.ltr?[run(t,o.size||28,{ltr:true})]:runs(t,o.size||28,o))});
const B={style:BorderStyle.SINGLE,size:6,color:"000000"};
const N={style:BorderStyle.NONE,size:0,color:"FFFFFF"};
const NB={top:N,bottom:N,left:N,right:N}, NBT={...NB,insideHorizontal:N,insideVertical:N};
const GREY={type:ShadingType.CLEAR,fill:"D9D9D9",color:"auto"};
const cell=(t,w,o={})=>new TableCell({borders:o.nob?NB:{top:o.noTop?N:B,bottom:o.noBottom?N:B,left:o.noLeft?N:B,right:o.noRight?N:B},
  width:{size:w,type:WidthType.DXA},columnSpan:o.span,shading:o.head?GREY:undefined,verticalAlign:o.v||VA.CENTER,
  margins:{top:o.mt??40,bottom:o.mb??40,left:80,right:80},

// cells given RIGHT→LEFT and stored reversed (no bidiVisual: iPhone Pages ignores it)
const row=(cells,h,hd)=>new TableRow({cantSplit:true,tableHeader:!!hd,height:h?{value:h,rule:HeightRule.ATLEAST}:undefined,children:[...cells].reverse()});
const table=(widthsRL,rows,o={})=>new Table({alignment:AL.CENTER,layout:TableLayoutType.FIXED,width:{size:widthsRL.reduce((a,c)=>a+c,0),type:WidthType.DXA},
  columnWidths:[...widthsRL].reverse(),borders:o.nob?NBT:undefined,rows});
const A=s=>String(s??"").replace(/[0-9]/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const A2=s=>String(s??"").replace(/[0-9A-Za-z=\/\\.\-]+/g,t=>/[A-Za-z]/.test(t)?t:A(t)); // لا يحوّل أرقام المواصفات اللاتينية
const DATE="     /     / "+A(new Date().getFullYear());
const sigTable=(cols,size=26,tw=10200)=>{const w=Math.floor(tw/cols.length);
  return table(cols.map(()=>w),[row(cols.map(l=>cell(l.map(x=>P(x,{align:AL.CENTER,size,line:300})),w,{nob:true})))],{nob:true});};
const tail=()=>new Paragraph({spacing:{before:0,after:0,line:20,lineRule:"exact"},children:[new TextRun({text:"",size:2})]});
const logoRun=(w,h)=>LOGO?new ImageRun({type:"jpg",data:LOGO,transformation:{width:w,height:h}}):new TextRun("");
const b64u=s=>{ const t=atob(s), u=new Uint8Array(t.length); for(let i=0;i<t.length;i++) u[i]=t.charCodeAt(i); return u; };
const imgRun=(dataUrl,w,h)=>{ const m=/^data:image\/(png|jpe?g);base64,(.*)$/.exec(dataUrl||""); if(!m) return new TextRun(""); return new ImageRun({type:m[1]==="png"?"png":"jpg",data:b64u(m[2]),transformation:{width:w,height:h}}); };
// هامش: النص + توقيع + ختم (الاسم، الصفة، الوقت)
const names3=t=>{ const l=String(t||"").split("\n").map(x=>x.trim().replace(/^[0-9٠-٩]+\s*[-\.]\s*/,"")).filter(Boolean); while(l.length<3) l.push(""); return l.map((x,i)=>P(A(i+1)+"- "+x,{after:120,size:22})); };
const marginParas=(list,sz=22)=>{ const out=[]; (list||[]).forEach(n=>{
  if(n.t) out.push(P(n.t,{size:sz,line:280}));
  const st=[n.by,n.roleName].filter(Boolean).join(" · ");

  return out.length?out:[P("",{size:sz})]; };

      cell([P("للتحقق من الكشف والاستمارة والتواقيع: امسح الرمز بكاميرا الهاتف، فيظهر الكشف الأصلي المسجل في التطبيق للمطابقة.",{size:18}),P("رمز التحقق: "+(J.code||""),{size:18})],8700,{nob:true})])],{nob:true}) : P("");

  const W=[600,4400,1000,1200,1400,1600], TW=10200, c=J.compact;

  const rows=J.rows.map((r,i)=>row([A(i+1),r[0],A(r[1]),r[2],A(r[3]),A(r[4])].map((v,j)=>cl(v,j,{align:j==1?AL.BOTH:AL.CENTER})),c?300:560));
  const tbl=table(W,[row(["ت",J.label||"تفاصيل العمل","الكمية","الوحدة","السعر","السعر الكلي"].map((h,i)=>cl(h,i,{head:true})),c?300:560,true),...rows,
    row([cl("المجموع / فقط "+J.words+" دينار لاغيرها",0,{span:5,w:TW-W[5],align:AL.BOTH}),cl(A(J.total),5)],c?300:560)]);
  return page([...HEADER3().map((h,i)=>P(h,{size:26,after:i==2?500:0})),P("نطاق الكشف/ "+J.scope,{size:32,line:340,after:400}),tbl,P("",{after:J.qr?500:900}),sigTable(COMM(),32),P("",{after:200}),qrBlock()]);
}

// تكبير الجداول لعرض الصفحة كاملة (مثل finish.sh) — يحتاج JSZip
async function widenTables(zipLib, blob){
  const z=await zipLib.loadAsync(await blob.arrayBuffer()), p="word/document.xml";
  let s=await z.file(p).async("string");
  s=s.replace(/<w:tblW w:type="dxa" w:w="10[24]00"\/><w:jc w:val="center"\/>/g,'<w:tblW w:type="pct" w:w="5000"/><w:jc w:val="center"/><w:tblInd w:w="0" w:type="dxa"/>');
  z.file(p,s);
  const u=await z.generateAsync({type:"uint8array",compression:"DEFLATE"});
  return new Blob([u],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

// الطباعة: صور الصفحات داخل الصفحة نفسها ثم أمر الطباعة (يعمل في الآيفون والأندرويد والحاسبة)

// الآيفون عند الطباعة يعيد تحميل الرابط من جديد، لذلك تُحمَّل بيانات الاستمارة في الرابط نفسه (#pv=...) وتُرسم فور التحميل
const pvEnc = o => { const b=new TextEncoder().encode(JSON.stringify(o)); let t=""; for(let i=0;i<b.length;i+=8192) t+=String.fromCharCode.apply(null,b.subarray(i,i+8192)); return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const pvDec = t => { t=t.replace(/-/g,"+").replace(/_/g,"/"); const r=atob(t), b=new Uint8Array(r.length); for(let i=0;i<r.length;i++) b[i]=r.charCodeAt(i); return JSON.parse(new TextDecoder().decode(b)); };
async function smallImg(u,w,h){ try{ const im=await new Promise((res,rej)=>{ const x=new Image(); x.onload=()=>res(x); x.onerror=rej; x.src=u; });
  const c=document.createElement("canvas"); c.width=w; c.height=h; const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,w,h); g.drawImage(im,0,0,w,h); return c.toDataURL("image/jpeg",0.6); }catch(e){ return u; } }

}
function printView(jobs,title,closeModal,fresh){

      .catch(()=>{}).then(()=>{ clearTimeout(tm); ready(); }); }
  // ضغطة وحدة تكفي: نافذة الطباعة بالآيفون تحتاج ثواني حتى تطلع، والضغط المتكرر يلغيها
  pb.onclick=()=>{ if(pb.disabled) return; pb.disabled=true; pb.innerHTML="⏳ تُفتح نافذة الطباعة… انتظر";

/* ================= التخجيداً: Firebase أو وضع التجربة ================= */
const CLOUD = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId && window.firebase);
let fs=null, auth=null, me=null;
// profile: {role: admin|committee|staff|pending, branch, name}
let profile={role:"admin",branch:"qadisiyah",name:""};
const isAdmin = () => profile.role==="admin";
const isCommittee = () => profile.role==="committee"||profile.role==="committee_v";

// تعديل الفقرات والأسعار: الفرع (مسودة)، الاعتدال، رئيس القسم والمعاون الفني بدورهم
const canEditRows = k => { const st=k.status||"draft";
  if(st==="draft") return canCreate();
  if(st==="review") return committeeMatches(k);
  if(st==="head"||st==="head2") return headMatches(k);
  if(st==="tech"||st==="tech2") return roleIs(techRole(k));
  return false; };
const canTath = k => isAdmin() || profile.role==="committee" || profile.role==="committee_v" || (profile.role==="staff" && k.branch===profile.branch);
const showDiff = k => !!(k.orig&&k.orig.rows) && (k.status||"draft")!=="draft";
const committeeMatches = k => isAdmin() || (profile.role==="committee"&&!k.vehicle) || (profile.role==="committee_v"&&!!k.vehicle);
const headMatches = k => isAdmin() || profile.role===headRole(k);
const roleIs = r => isAdmin() || profile.role===r;
const ROLE_NAMES = {admin:"مسؤول التطبيق",staff:"لجنة الفرع",head:"رئيس القسم",head_v:"رئيس قسم الآليات",adm:"المعاون الإداري",committee:"لجنة اعتدال الأسعار",committee_v:"لجنة اعتدال الآليات",tech:"المعاون الفني",fin:"الاعتماد المالي",dir:"المدير",store:"المخزن",lastfix:"موظف آخر تصليح",acc:"الحسابات",audh:"مسؤول التدقيق",aud:"المدقق",pending:"بانتظار الموافقة",blocked:"موقوف"};
// وضع التجربة: يحفظ بالمتصفح، وإذا المتصفح ما يسمح (مثل فتح الملف من معاينة) يحفظ مؤقتاً لحد ما تسد الصفحة
const MEM={};
const PERSIST=(()=>{ try{ localStorage.setItem("_t","1"); const ok=localStorage.getItem("_t")==="1"; localStorage.removeItem("_t"); return ok; }catch(e){ return false; } })();
const LS = { get(k,d){ try{ if(PERSIST) return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){} return k in MEM ? JSON.parse(MEM[k]) : d; },
  set(k,v){ MEM[k]=JSON.stringify(v); try{ if(PERSIST) localStorage.setItem(k,MEM[k]); }catch(e){} } };
const store = {
  listen(cb, err){
    const sort=a=>a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));
    if(CLOUD){
      // يحمّل فقط الكشوفات الذي بعدها قيد الإجراء + المصروفة آخر شهرين (القديمة تُفتح بالبحث)
      const by=q=>seesAll()?q:q.where("branch","==",profile.branch);
      const act=by(fs.collection("kashfs").where("status","in",["draft",...INFLOW]));
      const dn=by(fs.collection("kashfs").where("doneMonth","in",[monthKey(0),monthKey(1),monthKey(2)]));
      let A=[],B=[],ga=false,gb=false; const emit=()=>{ if(ga&&gb){ const m=new Map(); A.concat(B).forEach(x=>m.set(x.id,x)); cb(sort([...m.values()])); } };
      const u1=act.onSnapshot(s=>{ A=s.docs.map(d=>({id:d.id,...d.data()})); ga=true; emit(); }, err);
      const u2=dn.onSnapshot(s=>{ B=s.docs.map(d=>({id:d.id,...d.data()})); gb=true; emit(); }, err);
      return ()=>{ u1(); u2(); };
    }
    const load=()=>cb(sort(LS.get("kashfs",[]).map(k=>({branch:"qadisiyah",...k}))));
    store._local=load; load(); return ()=>{};
  },
  // بحث بالأرشيف برقم الكشف
  async findNo(no){
    if(!CLOUD) return LS.get("kashfs",[]).filter(k=>String(k.no)===String(no));
    let q=fs.collection("kashfs").where("no","==",String(no)); if(!seesAll()) q=q.where("branch","==",profile.branch);
    const s=await q.get(); return s.docs.map(d=>({id:d.id,...d.data()}));
  },

  const n=String(({head:CFG.app.whatsappHead,v:CFG.app.whatsappV,c:CFG.app.whatsapp,tech:CFG.app.whatsappTech,fin:CFG.app.whatsappFin,dir:CFG.app.whatsappDir,store:CFG.app.whatsappStore,lastfix:CFG.app.whatsappLast,acc:CFG.app.whatsappAcc,audh:CFG.app.whatsappAudh,aud:CFG.app.whatsappAud})[to]||"").replace(/[^\d]/g,"");
  const url=(n?`https://wa.me/${n}`:"https://wa.me/")+"?text="+encodeURIComponent(text+"\n"+location.href.split("#")[0]);
  const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
}

  const err=t=>$("#lerr").textContent=t;
  const msg=e=>({"auth/invalid-email":"الرقم أو البريد غير صحيح","auth/missing-password":"اكتب كلمة السر","auth/weak-password":"يجب أن تتكون كلمة السر من ٦ أحرف أو أكثر","auth/email-already-in-use":"لهذا الرقم حساب مسبق، سجّل الدخول",

  $("#lsw").onclick=()=>renderLogin(up?"in":"up");
  const fg=$("#lfg"); if(fg) fg.onclick=async()=>{ const id=authId($("#le").value);
    if(id.phone||id.err){ err("للدخول بالرقم: اطلب من مسؤول التطبيق حذف حسابك من Firebase، ثم أنشئ حساباً جديداً بالرقم نفسه."); return; }

let tab="home";
function isInbox(k){
  if(chatUnread(k)) return true;
  if(isDone(k)) return false;
  if(k.status==="draft") return (!!k.returned||!!k.storeBack) && myTurn(k) && !isAdmin();
  return myTurn(k);
}
function updNav(){

  nav.hidden=!(view==="list"||view==="settings"||view==="me"||view==="chat");
  $("#gear").hidden=nav.hidden; $("#gear").textContent=isAdmin()?"⚙️ الإدارة":"⚙️ حسابي";

function row(k){
  const [st,cl]=STATUS[k.status]||STATUS.draft, ret=k.status==="draft"&&k.returned, sb=k.status==="draft"&&k.storeBack&&!k.returned;
  return `<div class="lrow item" data-id="${esc(k.id)}" style="${selMode&&sel.has(k.id)?"background:#eef6fb":""}">
    <span class="lic">${selMode?(sel.has(k.id)?"☑️":"⬜️"):(ret?"↩️":SEMOJI[k.status]||"📝")}</span>

    <span class="badge ${ret?"b-ret":sb?"b-tech":cl}">${ret?"مُعاد إلى الفرع":sb?"📦 عاد من المخزن":st}</span>${msgLine(k)}</div>${tab==="inbox"&&isUnread(k)?`<span class="dot"></span>`:""}</div>`;

// آخر حركة على الكشف تنعرض مثل رسالة: من أرسله، ما كتب، ووكت
const lastNote = k => (k.notes||[]).slice(-1)[0];
const isUnread = k => { const n=lastNote(k); return !!n && LS.get("rd_"+k.id,0) < n.at; };
function msgLine(k){
  if(chatUnread(k)) return `<div class="msg new">💬 <b>رسالة من ${esc(k.lastChat.by)}</b>: ${esc(k.lastChat.t||"")}</div>`;
  const n=lastNote(k); if(!n || tab!=="inbox") return "";
  const t=new Date(n.at), w=toAr(t.getDate()+"/"+(t.getMonth()+1)+" "+String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0"));
  return `<div class="msg ${isUnread(k)?"new":""}"><div>📨 <b>من: ${esc(n.by||"")}</b> (${esc(ROLE_NAMES[n.role]||"")}) · ${w}</div><div>${esc(n.label||"")}${n.t?` — «${esc(n.t)}»`:""}</div></div>`;
}

async function shrinkTo(file,m,q){
  const img=await new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=u; });
  const s=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);

}

async function shrink(file){
  const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file);});
  const m=1800, s=Math.min(1, m/Math.max(img.width,img.height)), c=document.createElement("canvas");
  c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); const g=c.getContext("2d");
  g.filter="contrast(1.25) brightness(1.05)"; g.drawImage(img,0,0,c.width,c.height); // يوضّح كتابة القلم الجاف
  return c.toDataURL("image/jpeg",0.8).split(",")[1];
}
const PHOTO_PROMPT=`هذه صورة "كشف" صيانة من فرع ماء القادسية (العراق). استخرج محتواه بدقة.
أرجع JSON فقط بهذا الشكل:
{"no":"رقم الكشف إن وجد وإلا فارغ","title":"نص نطاق الكشف/اسم العمل بعد كلمة (نطاق الكشف/) إن وجدت","rows":[{"d":"تفاصيل العمل كاملة مع المنشأ إن كان مكتوباً","q":"الكمية","u":"الوحدة","p":"سعر المفرد","store":false}]}
قواعد:
- انسخ النص العربي بنفس الكلمات والإملاء المكتوبة بالورقة بدون تصحيح أو إعادة صياغة، واحتفظ بالمواصفات اللاتينية كما هي (مثل Q=200m3/hr).
- q و p أرقام إنكليزية (0-9) دون فواصل آلاف. p هو سعر المفرد وليس السعر الكلي.
- لا تكتب كلمة "جملة" أو "جمله" أبداً.
- إذا مكتوب بالسعر "اخراج مخزني" اجعل store=true و p="".
- لا تضف سطر المجموع ولا أسماء اللجنة كفقرات.
- الكشف ممكن يكون مكتوب كله بخط اليد (قلم جاف). اقرأ خط اليد بعناية وحوّله لكتابة بنفس الكلمات.
- مهم: الورقة ممكن تكون معدّلة باليد بالقلم الجاف (لجنة الاعتدال). القيمة المشطوبة اتركها، وخذ القيمة الجديدة المكتوبة باليد جنبها أو فوكها (بالسعر أو الكمية أو الوحدة أو التفاصيل).
- الفقرة المشطوبة كلها لا تكتبها. الفقرة المضافة بخط اليد اكتبها.
- إذا ما يمكنك تقرأ قيمة اتركها "" وأكمل باقي الفقرات ولا تتوقف.`;
// يجهّز الملف: صورة ← تُصغَّر وتوضَّح، PDF ← يُرسل كما هو، صورة ما تنفتح (HEIC) ← تُرسل كما هي
const b64file = f => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(f); });
async function prepFile(file){
  const isPdf = file.type==="application/pdf" || /\.pdf$/i.test(file.name||"");
  if(isPdf){ if(file.size>18e6) throw {status:-2}; return {mime:"application/pdf", data:await b64file(file)}; }
  try{ return {mime:"image/jpeg", data:await Promise.race([shrink(file), new Promise((_,j)=>setTimeout(()=>j(new Error("slow")),20000))])}; }
  catch(e){ if(file.size>18e6) throw {status:-2}; return {mime:file.type||"image/jpeg", data:await b64file(file)}; }
}
// مهلة كلية ٩٠ ثانية بدل الانتظار المفتوح
async function gemini(file, c, onStage){
  if(onStage) onStage("تجهيز الملف");
  const part=await prepFile(file), models=[...new Set([c.geminiModel||"gemini-2.5-flash","gemini-2.5-flash","gemini-flash-latest","gemini-flash-lite-latest"])];
  const end=Date.now()+150000; let last={status:-3};
  for(const model of models) for(let t=0;t<2;t++){
    const left=end-Date.now(); if(left<5000) throw last;
    if(onStage) onStage(t||model!==models[0]?"إعادة المحاولة":"إرسال إلى Gemini وانتظار الرد");
    try{ return await gemini1(part,model,c,Math.min(90000,left)); }
    catch(e){ last=e||{status:0}; if(e&&(e.status===400||e.status===401||e.status===403||e.status===-2)) throw e; if(e&&e.status===404) break;
      await new Promise(r=>setTimeout(r,e&&e.status===429?6000:1500)); }
  }
  throw last;
}
async function gemini1(part, model, c, ms, plain){
  const ac=new AbortController(), tm=setTimeout(()=>ac.abort(),ms||45000);
  // المفتاح بالهيدر (يشتغل للمفاتيح الجديدة AQ. والقديمة AIza)
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
    method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":c.geminiKey.trim()},
    signal:ac.signal,
    body:JSON.stringify({contents:[{parts:[{text:PHOTO_PROMPT},{inline_data:{mime_type:part.mime,data:part.data}}]}],generationConfig:Object.assign({responseMimeType:"application/json",temperature:0,maxOutputTokens:8192}, plain?{}:{thinkingConfig:{thinkingBudget:0}})})}).catch(e=>{ throw {status:e&&e.name==="AbortError"?-4:-5}; }).finally(()=>clearTimeout(tm));
  const j=await res.json().catch(()=>({}));
  if(!res.ok){ const msg=(j.error&&j.error.message)||""; if(res.status===400 && !plain && /think/i.test(msg)) return gemini1(part,model,c,ms,true); throw {status:res.status, msg}; }
  const txt=(((j.candidates||[])[0]||{}).content||{}).parts?.map(p=>p.text||"").join("")||"";
  let out; try{ out=JSON.parse(txt.replace(/^```json|```$/g,"").trim()); }catch(e){ const a=txt.indexOf("{"), b=txt.lastIndexOf("}"); out=JSON.parse(txt.slice(a,b+1)); }
  const rows=Array.isArray(out.rows)?out.rows.map(r=>({o:String(r.o||"").trim(),d:String(r.d||"").replace(/(^|\s)(ال)?جمل[ةه](?=\s|$)/g,"$1").trim(),q:toEn(r.q||""),u:String(r.u||"عدد").replace(/جمل[ةه]/g,"").trim()||"عدد",p:r.store?"":toEn(r.p||"").replace(/[^\d.]/g,""),store:!!r.store})).filter(r=>r.d):[];
  if(!rows.length && !out.title) throw {status:0};
  return {no:out.no?toEn(out.no):"", title:String(out.title||"").trim(), rows};
}

  clearTimeout(to); clearInterval(tk); if(st) st.textContent=msg;

// سكنر داخل الموبايل (Tesseract) — بدون Gemini. يقرأ الكتابة المطبوعة أفضل من اليدوية
let tessP=null;
const loadTess=()=> tessP||(tessP=new Promise((res,rej)=>{ if(window.Tesseract) return res(); const sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; sc.onload=res; sc.onerror=()=>{ tessP=null; rej(new Error("load")); }; document.head.appendChild(sc); }));
async function prepScan(file){
  const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file);});
  const m=2400, s=Math.min(1.6, m/Math.max(img.width,img.height)), c=document.createElement("canvas");
  c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); const g=c.getContext("2d");
  g.filter="grayscale(1) contrast(1.6) brightness(1.08)"; g.drawImage(img,0,0,c.width,c.height); return c;
}
const UNITS=/(عدد|متر\s*مربع|متر\s*مكعب|متر|م٢|م٣|م2|م3|كغم|كيلو\s*غرام|كيلوغرام|كيلواط|لتر|طن|قطعة|قطعه|زوج|لفة|لفه|كيس|علبة|علبه|برميل|سيت|طقم|ساعة|ساعه|يوم)/;
function parseOCR(text){
  const lines=String(text).split(/\n+/).map(x=>toEn(x).replace(/[|_\[\]{}<>]/g," ").replace(/\s+/g," ").trim()).filter(Boolean);
  let title="", rows=[];
  for(const L of lines){
    const tm=L.match(/نطاق\s*الكشف\s*[\/:\-]?\s*(.+)/); if(tm){ title=tm[1].trim(); continue; }
    if(/تفاصيل|الكمية|السعر الكلي|المجموع|لاغيرها|محافظة|مديرية|مركز تشغيل|المهندس|الفني/.test(L)) continue;
    const store=/اخراج\s*مخزني|إخراج\s*مخزني/.test(L);
    let t=L.replace(/اخراج\s*مخزني|إخراج\s*مخزني/g," ");
    const nums=[...t.matchAll(/\d+(?:[.,]\d+)?/g)].map(x=>({v:+x[0].replace(",","."),s:x[0],i:x.index}));
    const ar=(t.match(/[\u0600-\u06FF]/g)||[]).length; if(ar<3) continue;
    let ns=nums.slice(); if(ns.length && ns[0].i<4 && ns[0].v<100 && Number.isInteger(ns[0].v) && ns.length>1) ns.shift(); // رقم التسلسل
    // الأرقام الملاصقة لكلمات (مثل ٦ انج، ٥٥ كيلواط) تبقى داخل التفاصيل؛ نأخذ أرقام الأعمدة من نهاية السطر
    let q="",p="";
    const big=ns.filter(n=>n.v>=250);
    if(big.length>=2){ p=big[big.length-2].s; const before=ns.filter(n=>n.i<big[big.length-2].i); q=before.length?before[before.length-1].s:"1";
      if(+p && +big[big.length-1].v && Math.abs(+q*+p-big[big.length-1].v)>1 && big[big.length-1].v%+p===0) q=String(big[big.length-1].v/+p); }
    else if(big.length===1){ p=big[0].s; const before=ns.filter(n=>n.i<big[0].i); q=before.length?before[before.length-1].s:"1"; }
    else if(store && ns.length){ q=ns[ns.length-1].s; }
    else if(!ns.length && rows.length){ rows[rows.length-1].d+=" "+t.trim(); continue; } // تكملة سطر التفاصيل
    // التفاصيل = النص قبل عمود الكمية
    const pi = p ? (big.length>=2? big[big.length-2] : big[0]).i : 1e9;
    const cut = q && ns.filter(n=>n.s===q && n.i<pi).pop();
    let d=(cut? t.slice(0,cut.i) : t.replace(/\d+(?:[.,]\d+)?\s*$/,"")).replace(/^\s*\d{1,2}[\s\-.]+/,"");
    const um=(cut? t.slice(cut.i) : t).match(UNITS); let u=um?um[1].replace(/\s+/g," "):"عدد"; if(u==="قطعه") u="قطعة";
    d=d.replace(new RegExp("\\s*"+(um?um[1]:"@@")+"\\s*$"),"").replace(/(^|\s)(ال)?جمل[ةه](?=\s|$)/g,"$1").replace(/\s+/g," ").trim();
    if(d.length<3) continue;
    rows.push({d, q:q?String(+q):"", u, p:store?"":(p?String(+p):""), store});
  }
  return {title, rows};
}
async function scanOCR(file){
  const st=$("#phs"), t0=Date.now(); let stage="تحميل السكنر (أول مرة فقط ~٣ ميغا)", pct="";
  const draw=()=>{ if(st) st.innerHTML=`<span class="spin"></span> ${stage}${pct?` ${pct}`:""}… ${toAr(Math.round((Date.now()-t0)/1000))} ثانية`; }; draw(); const tk=setInterval(draw,1000);
  let w;
  try{
    await loadTess(); stage="تجهيز الصورة"; draw(); const can=await prepScan(file);
    stage="تحميل لغة العربي"; draw();
    w=await Tesseract.createWorker(["ara","eng"],1,{logger:m=>{ if(m.status==="recognizing text"){ stage="قراءة الكتابة"; pct=toAr(Math.round(m.progress*100))+"٪"; } }});
    await w.setParameters({preserve_interword_spaces:"1", tessedit_pageseg_mode:"6"});
    stage="قراءة الكتابة"; draw(); const {data}=await w.recognize(can);
    const out=parseOCR(data.text||"");
    if(!out.rows.length && !out.title) throw new Error("empty");
    if(out.title && !String(cur.title||"").trim()) cur.title=out.title;
    cur.rows = cur.rows.every(r=>!String(r.d).trim()) ? out.rows : cur.rows.concat(out.rows);
    if(!cur.rows.length) cur.rows.push(blankRow());
    dirty=true; clearInterval(tk); renderEdit();
    toast(`السكنر قرأ ${toAr(out.rows.length)} فقرة. راجع كل فقرة مع الورقة (السكنر أضعف من Gemini بالكتابة اليدوية).`,7000);
  }catch(e){ clearInterval(tk); const s2=$("#phs"); if(s2) s2.textContent = e&&e.message==="load" ? "تعذّر تحميل السكنر. تأكد من الإنترنت (يحتاجه أول مرة فقط)." : "السكنر لم يستطع قراءة الورقة. صوّرها من الأعلى بإضاءة جيدة وبدون ظل، أو اكتب الفقرات يدوياً."; }
  finally{ clearInterval(tk); if(w) w.terminate().catch(()=>{}); }
}
// داخل الكشف: صفحة أو أكثر للكشف نفسه (تُضاف الفقرات)

/* ================= تنزيل Word ================= */
async function makeWord(id, ks, base, btn){

  if(btn) btn.disabled=true;
  try{ for(const [f,J] of jobs){ const blob=await docx.Packer.toBlob(forms().build(f,J)); saveFile(await widenTables(JSZip,blob),FILE_EN[f]+base+".docx"); if(jobs.length>1) await new Promise(r=>setTimeout(r,800)); } }

/* ================= PDF لكل الاستمارات (نفس قالب الوورد مرسوم كصفحات) ================= */
let HFORMS=null;
function hforms(){ if(!HFORMS) HFORMS=makeForms(HtmlDocx, LOGO_B64); return HFORMS; }
// jobs = [[formId, J, title]] -> عناصر صفحات A4 جاهزة (بعد ضبط حجم الخط)
// S<1: الصفحة تُبنى أصغر فعلياً (عرض وارتفاع وهوامش وخط) حتى تدخل داخل هوامش الطابعة بدون أي تصغير من المتصفح
const PS = (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1)) ? 0.66 : 0.86;
function buildSheets(jobs, host, S){
  const sheets=[]; S=S||1;
  jobs.forEach(([f,J])=>{ hforms().build(f,J).pages().forEach(pg=>{
    const sh=document.createElement("div"); sh.className="sheet"+(S<1?" sm":"");
    const m={top:pg.margin.top*S,right:pg.margin.right*S,bottom:pg.margin.bottom*S,left:pg.margin.left*S};
    if(S<1){ sh.style.width=Math.round(794*S)+"px"; sh.style.height=Math.round(1123*S)+"px"; sh.dataset.s=S; sh.style.setProperty("--s",S); }
    sh.style.padding=`${m.top}px ${m.right}px ${m.bottom}px ${m.left}px`;
    sh.innerHTML=`<div class="c">${pg.html}</div>`; host.appendChild(sh); fitSheet(sh,m); sheets.push(sh); }); });
  return sheets;
}
// أكبر خط يملأ الصفحة (لحد ١٫٣)، وإذا ما كفت حتى بـ ٠٫٧٥ تطول الورقة وتنقسم لصفحات
function renderKPrev(host){
  try{ const w=host.clientWidth||340, sc=w/794; host.innerHTML=""; const inner=document.createElement("div"); inner.style.cssText=`transform:scale(${sc});transform-origin:top right;width:794px`;
    host.appendChild(inner); const sh=buildSheets(jobsFor(["kashf"],cur,false),inner)[0]; host.style.height=(1123*sc)+"px"; }catch(e){ host.textContent="تعذّر عرض الكشف"; }
}
function fitSheet(sh,m){
  const S=+(sh.dataset.s||1), H=1123*S, c=sh.firstChild, avail=H-m.top-m.bottom; let k=1.3*S;
  for(; k>0.75*S; k=+(k-0.05*S).toFixed(3)){ sh.style.setProperty("--k",k); if(c.scrollHeight<=avail*0.97) return; }
  sh.style.setProperty("--k",0.75*S);
  if(c.scrollHeight>avail){ const n=Math.ceil(c.scrollHeight/avail); sh.style.height=(H*n)+"px"; sh.dataset.pages=n; }
}
async function notBlank(u){
  const im=await new Promise(r=>{ const x=new Image(); x.onload=()=>r(x); x.onerror=()=>r(null); x.src=u; }); if(!im) return false;
  const c=document.createElement("canvas"); c.width=80; c.height=113; const g=c.getContext("2d"); g.drawImage(im,0,0,80,113);
  const d=g.getImageData(0,0,80,113).data; let n=0; for(let i=0;i<d.length;i+=4) if(d[i]<160&&d[i+1]<160&&d[i+2]<160) n++;
  return n>40;
}
async function sheetsToPdf(sheets, onProgress){
  const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait"}); let first=true, i=0; const pages=[];
  for(const sh of sheets){
    const off=document.createElement("div"); off.className="offscreen"; const node=sh.cloneNode(true); off.appendChild(node); document.body.appendChild(off);
    const H=sh.offsetHeight, opt={pixelRatio:2.2,backgroundColor:"#ffffff",width:794,height:H,skipFonts:true,quality:0.9};
    // متصفح الآيفون أحياناً يرسم الصفحة فارغة في المحاولات الأولى: نعيد حتى تظهر الكتابة
    let img="", ok=false;
    for(let t=0;t<6 && !ok;t++){ img=await htmlToImage.toJpeg(node,opt); if(t===0) continue; ok=await notBlank(img); if(!ok) await new Promise(r=>setTimeout(r,350)); }
    off.remove();
    if(!ok) throw new Error("blank page");
    const n=+(sh.dataset.pages||1);
    if(n===1){ if(!first) pdf.addPage(); pdf.addImage(img,"JPEG",0,0,210,297); first=false; pages.push(img); }
    else { const im=await new Promise(r=>{const x=new Image(); x.onload=()=>r(x); x.src=img;}); const ph=im.height/n;
      for(let p=0;p<n;p++){ const cv=document.createElement("canvas"); cv.width=im.width; cv.height=ph; cv.getContext("2d").drawImage(im,0,-p*ph);
        const u=cv.toDataURL("image/jpeg",0.9); if(!first) pdf.addPage(); pdf.addImage(u,"JPEG",0,0,210,297); first=false; pages.push(u); } }
    onProgress&&onProgress(++i, sheets.length);
  }
  const blob=pdf.output("blob"); blob.pages=pages; return blob;
}
// يعرض الصفحات مع زر تنزيل
async function showPdf(jobs, title, fname){
  if(!window.htmlToImage||!window.jspdf){ toast("مكتبة الـ PDF لم تُحمَّل، تأكد من الاتصال بالإنترنت"); return; }

  m.querySelector("#cl").onclick=()=>{ removeEventListener("resize",sc); m.remove(); };
  let blob=null, file=null; const bt=["#dl","#pr","#sh"].map(x=>m.querySelector(x)), lab=bt.map(x=>x.innerHTML);
  if(!IS_IOS){ bt.forEach(x=>x.disabled=true); bt[0].innerHTML=`<span class="spin"></span> تجهيز…`; }

  if(!IS_IOS) sheetsToPdf(sheets,(i,n)=>{ bt[0].innerHTML=`<span class="spin"></span> ${toAr(i)}/${toAr(n)}`; })
    .then(b=>{ blob=b; file=new File([b],fname,{type:"application/pdf"}); bt.forEach((x,i)=>{ x.disabled=false; x.innerHTML=lab[i]; }); })
    .catch(e=>{ console.error(e); bt[0].innerHTML=lab[0]; toast(String(e&&e.message)==="blank page"?"تعذّر رسم الصفحات على هذا الجهاز. أغلق النافذة وافتحها مرة أخرى":"حدث خطأ في إنشاء الـ PDF",7000); });
  m.querySelector("#dl").onclick=()=>{ if(IS_IOS){ toast("في الآيفون: اضغط «طباعة» ثم زر المشاركة ⬆️ أعلى نافذة الطباعة ← «حفظ في الملفات»",8000); printView(jobs,title,closeM); return; } if(!blob) return; if(IS_MOBILE && canShareFile(file)){ toast("اختر «حفظ في الملفات»",4000); shareNow(file,title); } else downloadLink(blob,fname); };
  // الآيفون: يُطبع ملف الـ PDF نفسه من قائمة الآيفون (طباعة صفحة الويب تخرج فارغة)
  const closeM=()=>m.querySelector("#cl").click();
  m.querySelector("#pr").onclick=()=>printView(jobs,title,closeM);
  const op=m.querySelector("#op"); if(op) op.onclick=()=>{ if(blob) openPdf(blob); };
  m.querySelector("#sh").onclick=()=>{ if(IS_IOS){ toast("في الآيفون: اضغط «طباعة» ثم زر المشاركة ⬆️ أعلى نافذة الطباعة ← واتساب",8000); printView(jobs,title,closeM); return; } if(!blob) return; if(canShareFile(file)) shareNow(file,title); else { downloadLink(blob,fname); toast("حُفظ الملف. أرسله من تطبيق الملفات إلى الجهة المطلوبة.",5000); } };
}
