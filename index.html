<style>
:root{--blue:#0b5f8a;--ink:#1d2730;--mute:#6b7782;--line:#d9e0e5;--bg:#f4f6f8;--ok:#1f7a4a;--okbg:#e5f4ec;--wait:#9a5b00;--waitbg:#fdf1dc;--red:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:16px}
button,input,textarea,select{font:inherit;color:inherit}
header{background:var(--blue);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px}
header h1{font-size:17px;margin:0;flex:1}
header .hb{background:none;border:0;color:#fff;font-size:14px;padding:4px 6px;cursor:pointer;opacity:.9}
header .back{font-size:22px}
main{max-width:720px;margin:0 auto;padding:14px 14px 110px}
.note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--mute);font-size:14px;margin-bottom:12px;line-height:1.7}
.note.warn{background:var(--waitbg);border-color:#efd59c;color:var(--wait)}
.filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card h3{font-size:15px;margin:0 0 6px}
.item{cursor:pointer}.item .t{font-weight:600;line-height:1.5}
.item .m{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.badge{font-size:12px;padding:2px 9px;border-radius:10px;font-weight:600}
.b-draft{background:#eef1f3;color:#4a5560}.b-review{background:var(--waitbg);color:var(--wait)}.b-approved{background:var(--okbg);color:var(--ok)}
.fab{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;border:0;border-radius:28px;padding:14px 26px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer;z-index:4}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input.i,textarea.i,select.i{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}
textarea.i{resize:vertical;min-height:64px;line-height:1.6}
input.i:focus,textarea.i:focus,select.i:focus{outline:2px solid var(--blue);border-color:transparent}
.row{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
.row .hd{display:flex;align-items:center;justify-content:space-between;font-weight:700;color:var(--blue);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.x{background:none;border:0;color:var(--red);font-size:14px;cursor:pointer}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:8px}
.chg{font-size:12px;color:var(--wait);margin-top:3px;line-height:1.5}
.chg::before{content:"كان: "}
.changed{background:#fffaf0!important;border-color:#e9c98a!important}
.newrow{border-color:#e9c98a;background:#fffdf7}
details.st{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
details.st summary{font-size:13px;color:var(--blue);cursor:pointer}
.kind{font-size:12px;color:var(--mute)}
.sum{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;width:100%;margin-top:8px}
.btn.sec{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.ok{background:var(--ok)}
.btn.ghost{background:none;color:var(--red);border:1px solid #e3c4c1}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px}.bar .btn{flex:1}
.fl{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #eef1f3}
.fl:first-of-type{border-top:0}
.fl span{flex:1;font-size:15px}
.fl small{display:block;color:var(--mute);font-size:12px}
.fl .btn{width:auto;margin:0;padding:8px 12px;font-size:14px}
.hint{font-size:13px;color:var(--mute);margin-top:6px;line-height:1.6}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#22313b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;background:rgba(15,25,32,.55);z-index:30;display:flex;flex-direction:column}
.modal .top{background:#fff;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
.modal .top b{flex:1}.modal .top .btn{width:auto;margin:0;padding:9px 14px}
.modal .scroll{flex:1;overflow:auto;padding:12px;background:#5d6a74}
.dlg{background:#fff;border-radius:14px;padding:18px;margin:auto;width:min(92vw,380px)}
.dlg p{margin:0 0 12px;line-height:1.7}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mute);padding:40px 10px;line-height:1.7}
.v{background:#f7f9fa;border-radius:8px;padding:8px 10px;line-height:1.6;min-height:38px}
.login{max-width:380px;margin:30px auto}
.login h2{font-size:18px;margin:0 0 4px}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:20px}
.link{background:none;border:0;color:var(--blue);cursor:pointer;font-size:14px;padding:6px 0;text-decoration:underline}
.photo{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:16px;font-weight:700;width:100%;font-size:17px;cursor:pointer}
/* ---------- A4 sheets (PDF) ---------- */
.wrap{transform-origin:top right}
.sheet{width:794px;height:1123px;background:#fff;color:#000;padding:48px 52px 40px;font-family:"Times New Roman",Times,serif;font-weight:700;direction:rtl;overflow:hidden;--k:1}
.sheet .c{font-size:calc(var(--k)*13pt);line-height:1.45}
.sheet .scope{text-align:justify;margin:22px 0 18px;font-size:calc(var(--k)*16pt)}
.sheet table.t{width:100%;border-collapse:collapse}
.sheet table.t th,.sheet table.t td{border:1px solid #000;padding:5px 6px;text-align:center;vertical-align:middle}
.sheet table.t th{background:#d9d9d9}
.sheet table.t td.d{text-align:justify}
.sheet .names{display:flex;text-align:center;margin-top:calc(var(--k)*90px);font-size:calc(var(--k)*16pt)}
.sheet .names>div{flex:1;line-height:1.9}
.sheet .eh{display:flex;justify-content:space-between;align-items:flex-start;line-height:1.5}
.sheet .eh .en{direction:ltr;text-align:left;font-size:calc(var(--k)*11pt)}
.sheet .hr{border-bottom:1.5px solid #000;margin:8px 0 16px}
.sheet .ttl{text-align:center;font-size:calc(var(--k)*14pt);margin-bottom:10px}
.sheet .par{text-align:justify;font-size:calc(var(--k)*14pt);line-height:1.7;margin-bottom:10px}
.sheet .sig{display:flex;text-align:center;margin-top:calc(var(--k)*60px);font-size:calc(var(--k)*13pt)}
.sheet .sig>div{flex:1;line-height:1.8}
.offscreen{position:fixed;top:0;left:-20000px}
</style>

const MEM={};
const PERSIST=(()=>{ try{ localStorage.setItem("_t","1"); const ok=localStorage.getItem("_t")==="1"; localStorage.removeItem("_t"); return ok; }catch(e){ return false; } })();
const LS = { get(k,d){ try{ if(PERSIST) return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){} return k in MEM ? JSON.parse(MEM[k]) : d; },
  set(k,v){ MEM[k]=JSON.stringify(v); try{ if(PERSIST) localStorage.setItem(k,MEM[k]); }catch(e){} } };
const store = {
  listen(cb, err){
    const sort=a=>a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));
    if(CLOUD){ let q=fs.collection("kashfs"); if(!seesAll()) q=q.where("branch","==",profile.branch);
      return q.onSnapshot(s=>cb(sort(s.docs.map(d=>({id:d.id,...d.data()})))), err); }
    const load=()=>cb(sort(LS.get("kashfs",[]).map(k=>({branch:"qadisiyah",...k}))));
    store._local=load; load(); return ()=>{};
  },
  async save(id, data){
    if(CLOUD){ const ref=id?fs.collection("kashfs").doc(id):fs.collection("kashfs").doc(); await ref.set(data); return ref.id; }
    id=id||("k"+Date.now()+Math.random().toString(36).slice(2,6)); const a=LS.get("kashfs",[]).filter(x=>x.id!==id); a.push({...data,id}); LS.set("kashfs",a); setTimeout(store._local,0); return id;
  },
  async remove(id){
    if(CLOUD) return fs.collection("kashfs").doc(id).delete();
    LS.set("kashfs",LS.get("kashfs",[]).filter(x=>x.id!==id)); setTimeout(store._local,0);
  },
  async getDoc(name){ if(CLOUD){ const d=await fs.collection("config").doc(name).get(); return d.exists?d.data():{}; } return LS.get("cfg_"+name,{}); },
  async setDoc(name,v){ if(CLOUD) return fs.collection("config").doc(name).set(v); LS.set("cfg_"+name,v); },
  async getConfig(){ return this.getDoc("app"); },
  async users(){ if(CLOUD){ const s=await fs.collection("users").get(); return s.docs.map(d=>({id:d.id,...d.data()})); } return LS.get("users",[]); },
  async setUser(id,v){ if(CLOUD) return fs.collection("users").doc(id).update(v); LS.set("users",LS.get("users",[]).map(u=>u.id===id?{...u,...v}:u)); }
};

function authId(v){

  if(d.startsWith("0")) d="964"+d.slice(1); else if(d.length===10 && d[0]==="7") d="964"+d;

function jobsFor(ids, ks, skipEmpty){

    fl.forEach(f=>{ const J=formData(f,ks,cfgFor(br)); if(skipEmpty && J.items && !J.items.length) return; out.push([f,J]); });

  return out;
}

      if(c&&!n){n=document.createElement("div");n.className="chg";n.textContent=cur.orig.title;e.after(n);} if(!c&&n)n.remove(); } };});
  const veh=document.getElementById("veh"); if(veh) veh.onchange=()=>{ cur.vehicle=veh.checked; dirty=true; updFormInfo(); };
  const rows=$("#rows");
  rows.oninput=e=>{ const el=e.target, w=el.closest("[data-i]"); if(!w||!el.dataset.k) return; const i=+w.dataset.i, r=cur.rows[i], f=el.dataset.k;
    if(f==="store"){ r.store=el.checked; dirty=true; renderRows(); return; }
    r[f]=el.value; dirty=true; markChange(el,i);
    const rt=w.querySelector("[data-rt]"); if(rt) rt.textContent="السعر الكلي: "+(r.store?"اخراج مخزني":fmt(rowTotal(r)));
    const kl=w.querySelector("[data-kl]"); if(kl){ const kd=kindOf(r); kl.textContent=KINDS[kd]+(kd==="material"?" · "+sName(r):""); }
    if(f==="d"){ const sn=w.querySelector('[data-k="sname"]'), mt=w.querySelector('[data-k="metal"]'), sk=w.querySelector('[data-k="kind"] option[value=""]');
      if(sn) sn.placeholder=autoSName(r); if(mt) mt.placeholder=autoMetal(r); if(sk) sk.textContent=`تلقائي (${KINDS[autoKind(r)]})`; }
    updTot(); updFormInfo(); };
  rows.onchange=e=>{ if(e.target.dataset.k==="kind") rows.oninput(e); };
  rows.onclick=async e=>{ const d=e.target.dataset.del; if(d===undefined) return; if(String(cur.rows[+d].d).trim() && !(await ask("تحذف هذه الفقرة؟","حذف",true))) return;
    cur.rows.splice(+d,1); if(!cur.rows.length) cur.rows.push(blankRow()); dirty=true; renderEdit(); };
  on("add",()=>{ cur.rows.push(blankRow()); dirty=true; renderRows(); const a=rows.querySelectorAll('textarea[data-k="d"]'); a[a.length-1].focus(); });
  on("save",()=>save());
  on("send",async()=>{ if(!valid()) return; snapOrig(); if(!(await save("review","انرسل للجنة الاعتدال ✓"))) return;
    if(await ask("انرسل للجنة. تبلّغهم بالواتساب هسه؟","واتساب")) whatsapp("📋 كشف جديد بانتظار لجنة اعتدال الأسعار:\n"+kashfLine(cur)); });
  on("wa",()=>whatsapp("تذكير: كشف بانتظار لجنة اعتدال الأسعار:\n"+kashfLine(cur)));
  const kbr=document.getElementById("kbr"); if(kbr) kbr.onchange=()=>{ cur.branch=kbr.value; dirty=true; };
  on("appr",async()=>{ if(!valid()) return; if(!(await ask("تعتمد هذا الكشف؟","اعتماد"))) return;
    cur.approvedByName=myName(); cur.approvedAt=Date.now(); if(!(await save("approved","انعتمد ✓"))) return;
    if(await ask("انعتمد. تبلّغ الفرع بالواتساب؟","واتساب")) whatsapp("✅ انعتمد الكشف من لجنة اعتدال الأسعار:\n"+kashfLine(cur)); });
  on("toDraft",async()=>{ if(await ask("ترجعه مسودة حتى كاتب الكشف يعدّل؟","إرجاع")) await save("draft","رجع مسودة"); });
  on("reopen",async()=>{ if(await ask("تفتحه مرة ثانية للجنة؟","فتح")){ snapOrig(); await save("review","انفتح للجنة"); } });
  on("del",async()=>{ if(!(await ask("تحذف هذا الكشف نهائياً؟","حذف",true))) return; try{ await store.remove(curId); dirty=false; toast("انحذف"); renderList(); }catch(e){ toast("ما انحذف، حاول مرة ثانية."); } });
  on("ph",()=>$("#phf").click());
  bindForms(cur, cur.no?"_"+toEn(cur.no).replace(/[^0-9A-Za-z-]/g,""):"");
}
function snapOrig(){ cur.rows.forEach((r,i)=>r._o=i); cur.orig={title:cur.title,rows:clone(cur.rows).map(r=>{delete r._o;return r;})}; }
function valid(){
  if(!String(cur.title||"").trim()){ toast("اكتب نطاق الكشف أولاً"); return false; }
  const bad=cur.rows.findIndex(r=>!String(r.d).trim()||!num(r.q)||(!r.store&&!num(r.p)));
  if(bad>=0){ toast(`الفقرة ${toAr(bad+1)} ناقصة (التفاصيل أو الكمية أو السعر)`); return false; }
  return true;
}
let saving=false;
async function save(status,msg){
  if(saving) return; saving=true;
  const btns=[...document.querySelectorAll(".btn")]; btns.forEach(b=>b.disabled=true);
  try{
    const now=Date.now(), data=clone(cur); delete data.id;
    data.rows=data.rows.filter(r=>String(r.d).trim()||num(r.q)||num(r.p));
    if(status) data.status=status;
    if(data.status!=="review"){ delete data.orig; data.rows.forEach(r=>delete r._o); }
    data.updatedAt=now; data.updatedByName=myName();
    if(!curId){ data.createdAt=now; data.createdByName=myName(); }
    curId=await store.save(curId,data);
    cur=data; if(!cur.rows.length) cur.rows.push(blankRow());
    dirty=false; toast(msg||"انحفظ ✓"); renderEdit(); return true;
  }catch(e){ toast(e&&e.code==="permission-denied"?"ما عندك صلاحية. اطلب من المسؤول يضيف إيميلك.":"ما انحفظ، تأكد من الإنترنت وحاول مرة ثانية."); btns.forEach(b=>b.disabled=false); }
  finally{ saving=false; }
}

/* ================= تصوير الكشف (Gemini) ================= */
$("#phf").onchange=()=>{ const f=$("#phf"), files=[...f.files]; f.value=""; if(files.length) readPhoto(files); };
async function shrink(file){
  const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file);});
  const m=2000, s=Math.min(1, m/Math.max(img.width,img.height)), c=document.createElement("canvas");
  c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.88).split(",")[1];
}
const PHOTO_PROMPT=`هذه صورة "كشف" صيانة من فرع ماء القادسية (العراق). استخرج محتواه بدقة.
أرجع JSON فقط بهذا الشكل:
{"no":"رقم الكشف إن وجد وإلا فارغ","title":"نص نطاق الكشف/اسم العمل بعد كلمة (نطاق الكشف/) إن وجدت","rows":[{"d":"تفاصيل العمل","q":"الكمية","u":"الوحدة","p":"سعر المفرد","store":false}]}
قواعد:
- انسخ النص العربي بنفس الكلمات والإملاء المكتوبة بالورقة بدون تصحيح أو إعادة صياغة، واحتفظ بالمواصفات اللاتينية كما هي (مثل Q=200m3/hr).
- q و p أرقام بالإنكليزي (0-9) بدون فواصل آلاف. p هو سعر المفرد وليس السعر الكلي.
- إذا مكتوب بالسعر "اخراج مخزني" اجعل store=true و p="".
- لا تضف سطر المجموع ولا أسماء اللجنة كفقرات.
- إذا ما تكدر تقرأ قيمة اتركها "".`;
async function gemini(file, c){
  const data=await shrink(file), model=c.geminiModel||"gemini-flash-latest";
  // المفتاح بالهيدر (يشتغل للمفاتيح الجديدة AQ. والقديمة AIza)
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
    method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":c.geminiKey.trim()},
    body:JSON.stringify({contents:[{parts:[{text:PHOTO_PROMPT},{inline_data:{mime_type:"image/jpeg",data}}]}],generationConfig:{responseMimeType:"application/json",temperature:0}})});
  const j=await res.json().catch(()=>({}));
  if(!res.ok) throw {status:res.status};
  const txt=(((j.candidates||[])[0]||{}).content||{}).parts?.map(p=>p.text||"").join("")||"";
  const out=JSON.parse(txt.replace(/^```json|```$/g,"").trim());
  const rows=Array.isArray(out.rows)?out.rows.map(r=>({d:String(r.d||"").trim(),q:toEn(r.q||""),u:String(r.u||"عدد"),p:r.store?"":toEn(r.p||"").replace(/[^\d.]/g,""),store:!!r.store})).filter(r=>r.d):[];
  if(!rows.length && !out.title) throw {status:0};
  return {no:out.no?toEn(out.no):"", title:String(out.title||"").trim(), rows};
}
const photoErr = e => e&&e.status===429?"خلص الحد المجاني لهسه، حاول بعد دقيقة.":e&&(e.status===400||e.status===401||e.status===403||e.status===404)?"المفتاح غلط أو الموديل ما موجود. تأكد منه بالإعدادات.":"ما كدرت أقرأ الصورة. صوّرها أوضح (ضوء جيد والورقة كاملة) أو اكتب الفقرات باليد.";
async function getKey(){ try{ CFG.app=await store.getDoc("app"); }catch(e){} const c=CFG.app||{}; if(!c.geminiKey){ toast(isAdmin()?"قراءة الصور تحتاج مفتاح Gemini. ضيفه من ⚙︎ ← إعدادات عامة.":"قراءة الصور بعدها ما مفعّلة. اطلب من مسؤول التطبيق يضيف مفتاح Gemini.",5000); return null; } return c; }
// داخل الكشف: صفحة أو أكثر لنفس الكشف (تنضاف الفقرات)
async function readPhoto(files){
  const st=$("#phs"), b=$("#ph"); const c=await getKey(); if(!c) return;
  b.disabled=true; let added=0;
  try{
    for(let i=0;i<files.length;i++){
      st.innerHTML=`<span class="spin"></span> دا أقرأ ${files.length>1?`الصفحة ${toAr(i+1)} من ${toAr(files.length)}`:"الكشف"}… (نص دقيقة تقريباً)`;
      const out=await gemini(files[i],c);
      if(out.title && !String(cur.title||"").trim()) cur.title=out.title;
      if(out.no && !cur.no) cur.no=out.no;
      cur.rows = cur.rows.every(r=>!String(r.d).trim()) ? out.rows : cur.rows.concat(out.rows); added+=out.rows.length;
    }
    if(!cur.rows.length) cur.rows.push(blankRow());
    dirty=true; renderEdit(); toast(`انقرأت ${toAr(added)} فقرة. راجعها مع الورقة قبل الحفظ.`,5000);
  }catch(e){ if(added){ dirty=true; renderEdit(); } const s2=$("#phs"); if(s2) s2.textContent=photoErr(e); const b2=$("#ph"); if(b2) b2.disabled=false; }
}
// من القائمة: كل صورة = كشف جديد (مسودة)
$("#phm").onchange=async()=>{
  const f=$("#phm"), files=[...f.files]; f.value=""; if(!files.length) return;
  const c=await getKey(); if(!c) return;
  const box=$("#batch"); let ok=0, bad=0;
  for(let i=0;i<files.length;i++){
    if(box) box.innerHTML=`<span class="spin"></span> دا أقرأ الكشف ${toAr(i+1)} من ${toAr(files.length)}…`;
    try{ const out=await gemini(files[i],c), now=Date.now();
      await store.save(null,{no:out.no,title:out.title,rows:out.rows.length?out.rows:[blankRow()],status:"draft",tasirNo:"",branch:newBranch(),createdAt:now,updatedAt:now,createdByName:myName(),updatedByName:myName()}); ok++; }
    catch(e){ bad++; if(e&&e.status===429){ await new Promise(r=>setTimeout(r,20000)); try{ const out=await gemini(files[i],c), now=Date.now(); await store.save(null,{no:out.no,title:out.title,rows:out.rows,status:"draft",tasirNo:"",branch:newBranch(),createdAt:now,updatedAt:now,createdByName:myName()}); ok++; bad--; }catch(x){} } }
  }
  const msg=`انضافت ${toAr(ok)} كشوفات كمسودات${bad?`، و${toAr(bad)} ما انقرأت`:""}. افتح كل وحدة وراجعها.`;
  batchMsg=msg; const b2=$("#batch"); if(b2) b2.textContent=msg; toast(msg,6000);
};

/* ================= تنزيل Word ================= */
async function makeWord(id, ks, base, btn){
  if(!window.docx||!window.JSZip){ toast("مكتبة الوورد ما تحمّلت، تأكد من الإنترنت"); return; }
  const jobs=jobsFor([id],ks,false);
  if(jobs.some(j=>j[1].items&&!j[1].items.length) && !(await ask("ماكو مواد لهذه الاستمارة. تنزّلها فارغة؟","تنزيل"))) return;
  if(btn) btn.disabled=true;
  try{ for(const [f,J] of jobs){ const blob=await docx.Packer.toBlob(forms().build(f,J)); saveFile(await widenTables(JSZip,blob),FILE_EN[f]+base+".docx"); if(jobs.length>1) await new Promise(r=>setTimeout(r,800)); } }
  catch(e){ console.error(e); toast("صار خطأ بإنشاء ملف الوورد"); }
  finally{ if(btn) btn.disabled=false; }
}

/* ================= PDF لكل الاستمارات (نفس قالب الوورد مرسوم كصفحات) ================= */
let HFORMS=null;
function hforms(){ if(!HFORMS) HFORMS=makeForms(HtmlDocx, LOGO_B64); return HFORMS; }
// jobs = [[formId, J, title]] -> عناصر صفحات A4 جاهزة (بعد ضبط حجم الخط)
function buildSheets(jobs, host){
  const sheets=[];
  jobs.forEach(([f,J])=>{ hforms().build(f,J).pages().forEach(pg=>{
    const sh=document.createElement("div"); sh.className="sheet";
    sh.style.padding=`${pg.margin.top}px ${pg.margin.right}px ${pg.margin.bottom}px ${pg.margin.left}px`;
    sh.innerHTML=`<div class="c">${pg.html}</div>`; host.appendChild(sh); fitSheet(sh,pg.margin); sheets.push(sh); }); });
  return sheets;
}
// أكبر خط يملأ الصفحة (لحد ١٫٣)، وإذا ما كفت حتى بـ ٠٫٧٥ تطول الورقة وتنقسم لصفحات
function fitSheet(sh,m){
  const c=sh.firstChild, avail=1123-m.top-m.bottom; let k=1.3;
  for(; k>0.75; k=+(k-0.05).toFixed(2)){ sh.style.setProperty("--k",k); if(c.scrollHeight<=avail*0.97) return; }
  sh.style.setProperty("--k",0.75);
  if(c.scrollHeight>avail){ const n=Math.ceil(c.scrollHeight/avail); sh.style.height=(1123*n)+"px"; sh.dataset.pages=n; }
}
async function sheetsToPdf(sheets, onProgress){
  const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait"}); let first=true, i=0;
  for(const sh of sheets){
    const off=document.createElement("div"); off.className="offscreen"; const node=sh.cloneNode(true); off.appendChild(node); document.body.appendChild(off);
    const H=sh.offsetHeight, opt={pixelRatio:2.2,backgroundColor:"#ffffff",width:794,height:H,skipFonts:true,quality:0.9};
    let img=await htmlToImage.toJpeg(node,opt); img=await htmlToImage.toJpeg(node,opt); off.remove();
    const n=+(sh.dataset.pages||1);
    if(n===1){ if(!first) pdf.addPage(); pdf.addImage(img,"JPEG",0,0,210,297); first=false; }
    else { const im=await new Promise(r=>{const x=new Image(); x.onload=()=>r(x); x.src=img;}); const ph=im.height/n;
      for(let p=0;p<n;p++){ const cv=document.createElement("canvas"); cv.width=im.width; cv.height=ph; cv.getContext("2d").drawImage(im,0,-p*ph);
        if(!first) pdf.addPage(); pdf.addImage(cv.toDataURL("image/jpeg",0.9),"JPEG",0,0,210,297); first=false; } }
    onProgress&&onProgress(++i, sheets.length);
  }
  return pdf.output("blob");
}
// يعرض الصفحات ويه زر تنزيل
async function showPdf(jobs, title, fname){
  if(!window.htmlToImage||!window.jspdf){ toast("مكتبة الـ PDF ما تحمّلت، تأكد من الإنترنت"); return; }
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="top"><b>${esc(title)}</b><button class="btn" id="dl">تنزيل PDF</button><button class="btn sec" id="cl">إغلاق</button></div><div class="scroll"><div class="wrap"></div></div>`;
  document.body.appendChild(m);
  const wrap=m.querySelector(".wrap"); let sheets;
  try{ sheets=buildSheets(jobs, wrap); }catch(e){ console.error(e); toast("صار خطأ بتجهيز الصفحات"); m.remove(); return; }
  wrap.querySelectorAll(".sheet").forEach(s=>s.style.marginBottom="14px");
  const sc=()=>{ const w=m.querySelector(".scroll").clientWidth-24, s=Math.min(1,w/794); wrap.style.transform=`scale(${s})`; wrap.style.width=(794*s)+"px"; wrap.style.height=(wrap.scrollHeight*s)+"px"; };
  sc(); addEventListener("resize",sc);
  m.querySelector("#cl").onclick=()=>{ removeEventListener("resize",sc); m.remove(); };
  const dl=m.querySelector("#dl");
  dl.onclick=async()=>{ dl.disabled=true; const old=dl.innerHTML;
    try{ const blob=await sheetsToPdf(sheets,(i,n)=>dl.innerHTML=`<span class="spin"></span> ${toAr(i)}/${toAr(n)}`); saveFile(blob,fname); }
    catch(e){ console.error(e); toast("صار خطأ بإنشاء الـ PDF"); }
    finally{ dl.disabled=false; dl.innerHTML=old; } };
}
